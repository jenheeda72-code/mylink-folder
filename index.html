<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyLink - 곽성재</title>
    <style>
        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
            width: 90%;
            max-width: 360px;
        }
        .profile-img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: #4a90e2;
            color: white;
            font-size: 32px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 15px;
        }
        h1 {
            font-size: 22px;
            color: #333;
            margin: 0 0 8px;
        }
        p {
            font-size: 14px;
            color: #777;
            margin: 0 0 25px;
        }
        .link-btn {
            display: block;
            text-decoration: none;
            background-color: #222;
            color: white;
            padding: 14px;
            margin: 12px 0;
            border-radius: 12px;
            font-weight: bold;
            font-size: 15px;
            transition: transform 0.15s, background-color 0.15s;
        }
        .link-btn:hover {
            background-color: #444;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile-img">성재</div>
        <h1>곽성재의 마이링크</h1>
        <p>환영합니다! 자주 가는 사이트 모음입니다.</p>
        
        <a href="https://www.youtube.com" target="_blank" class="link-btn">유튜브 (YouTube)</a>
        <a href="https://www.google.com" target="_blank" class="link-btn">구글 (Google)</a>
    </div>
</body>
</html>
